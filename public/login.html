<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - Family Circle</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self';">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f0f7fd;
      display: flex;
    }

    .sidebar {
      width: 250px;
      background-color: #0f3c61;
      color: white;
      padding: 2rem 1rem;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .sidebar h2 {
      margin: 0 0 2rem 0;
      font-size: 1.5rem;
      text-align: center;
    }

    .kin-keepers-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* shift upward */
      flex-grow: 1;
      margin-top: 2rem; /* extra spacing from top */
    }

    .kin-keepers-container img {
      max-width: 100%;
      max-height: 200px;
      height: auto;
      display: block;
      margin-bottom: 0.5rem;
    }

    .kin-keepers-container span {
      font-size: 1.2rem;
      font-weight: bold;
      color: gold;
      text-align: center;
    }

    .content {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-card {
      background-color: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 350px;
    }

    .form-card h2 {
      margin-bottom: 1.5rem;
      color: #0f3c61;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      width: 100%;
      background-color: #0f3c61;
      color: white;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #0d3557;
    }

    p {
      margin-top: 1rem;
      text-align: center;
    }

    a {
      color: #0f3c61;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>Family Circle</h2>
    <div class="kin-keepers-container">
      <img src="kin-keepers.png" alt="Kin-Keepers Logo" />
      <span>Kin-Keepers</span>
    </div>
  </div>

  <div class="content">
    <div class="form-card">
      <h2>Login</h2>
      <form id="loginForm">
        <input name="email" type="email" placeholder="Email" required />
        <input name="password" type="password" placeholder="Password" required />
        <div id="loginMessage" style="color:red; font-size:0.9rem; margin-bottom:0.5rem;"></div>
        <button type="submit">Login</button>
      </form>
      <p>Don't have an account? <a href="#" id="goToRegister">Register</a></p>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
